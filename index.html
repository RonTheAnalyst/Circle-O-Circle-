<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a Circle Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    
    <div class="max-w-4xl w-full flex flex-col items-center">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Area of a Circle: Unrolling into a Rectangle</h1>
        <p class="text-gray-600 mb-6 text-center">Watch how dividing a circle into smaller slices approaches a perfect rectangle with width = πr and height = r, proving Area = πr².</p>
        
        <div class="flex gap-4 mb-4">
            <button id="playPauseBtn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold transition">Play</button>
            <button id="nextBtn" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold transition">Next Step</button>
            <button id="resetBtn" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 font-bold transition">Reset</button>
        </div>
        
        <div class="text-xl font-mono mb-4 text-gray-700 font-bold" id="statusText">Slices: 4</div>
        
        <canvas id="simCanvas" width="900" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        
        let isPlaying = false;
        let slices = 4;
        const maxSlices = 2048; 
        let progress = 0; // 0 to 1
        
        // Animation States: 'CIRCLE' -> 'UNROLLING' -> 'RECTANGLE' -> 'MORPHING_TO_CIRCLE'
        let state = 'CIRCLE'; 
        
        const R = 120; // Radius
        const circleCenter = { x: 450, y: 150 };
        const rectCenter = { x: 450, y: 400 };

        function drawWedge(cx, cy, radius, startAngle, endAngle, color) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const sliceAngle = (2 * Math.PI) / slices;
            const rectWidth = Math.PI * R;
            const wedgeBaseWidth = rectWidth / (slices / 2);
            const startX = rectCenter.x - rectWidth / 2;

            for (let i = 0; i < slices; i++) {
                const color = i % 2 === 0 ? '#3b82f6' : '#60a5fa'; // Alternating blue colors
                
                // --- Circle Position ---
                const currentAngle = i * sliceAngle;
                
                // --- Rectangle Position ---
                const isBottom = i % 2 === 0;
                let targetX, targetY, targetStartAngle;
                
                if (isBottom) {
                    targetX = startX + (i / 2) * wedgeBaseWidth + wedgeBaseWidth / 2;
                    targetY = rectCenter.y + R / 2; // FIXED: Apex at bottom so wedges point UP
                    targetStartAngle = -Math.PI / 2 - sliceAngle / 2;
                } else {
                    targetX = startX + Math.floor(i / 2) * wedgeBaseWidth + wedgeBaseWidth;
                    targetY = rectCenter.y - R / 2; // FIXED: Apex at top so wedges point DOWN
                    targetStartAngle = Math.PI / 2 - sliceAngle / 2;
                }

                // --- Interpolation based on state ---
                let x = circleCenter.x;
                let y = circleCenter.y;
                let angleOffset = currentAngle;
                
                // Staggered unrolling effect
                let t = 0;
                if (state === 'UNROLLING' || state === 'MORPHING_TO_CIRCLE') {
                    // Delay based on slice index for cascading effect
                    const delay = i * (0.5 / slices);
                    let rawT = (progress - delay) * 2; 
                    t = Math.max(0, Math.min(1, rawT));
                    
                    // Ease in out
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 
                    
                    if (state === 'MORPHING_TO_CIRCLE') t = 1 - t;
                } else if (state === 'RECTANGLE') {
                    t = 1;
                }

                x = circleCenter.x + (targetX - circleCenter.x) * t;
                y = circleCenter.y + (targetY - circleCenter.y) * t;
                
                // Adjust rotation dynamically
                let currentRot = currentAngle + (targetStartAngle - currentAngle) * t;
                
                // Draw the wedge using translated/rotated context
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(currentRot + sliceAngle / 2);
                drawWedge(0, 0, R, -sliceAngle / 2, sliceAngle / 2, color);
                ctx.restore();
            }

            // Draw Labels when in rectangle shape
            if (state === 'RECTANGLE' && progress > 0.8) {
                ctx.fillStyle = '#374151';
                ctx.font = '16px monospace';
                ctx.fillText('Height = r', startX - 100, rectCenter.y + 5);
                ctx.fillText('Width = πr', rectCenter.x - 40, rectCenter.y + R / 2 + 30);
                
                // Draw formula if at large slices
                if (slices >= 256) {
                    ctx.font = 'bold 24px sans-serif';
                    ctx.fillStyle = '#111827';
                    ctx.fillText('Area = (πr) × r = πr²', rectCenter.x - 110, rectCenter.y - R - 30);
                }
            }
        }

        let animationId;
        let lastTime = 0;
        
        function animate(time) {
            if (!lastTime) lastTime = time;
            const delta = time - lastTime;
            lastTime = time;

            if (isPlaying) {
                stepAnimation(delta);
            }
            
            render();
            animationId = requestAnimationFrame(animate);
        }

        function stepAnimation(delta) {
            const speed = 0.0008; // Adjust overall speed here
            
            if (state === 'CIRCLE') {
                progress += speed * delta;
                if (progress > 0.5) { // Pause briefly as a circle
                    progress = 0;
                    state = 'UNROLLING';
                }
            } else if (state === 'UNROLLING') {
                progress += speed * delta * 1.5;
                if (progress >= 1) {
                    progress = 1;
                    state = 'RECTANGLE';
                }
            } else if (state === 'RECTANGLE') {
                progress += speed * delta * 0.5; // Pause to read
                if (progress > 1.5) {
                    progress = 0;
                    if (slices >= maxSlices) {
                        isPlaying = false; // Stop at infinite
                        document.getElementById('playPauseBtn').innerText = 'Done';
                    } else {
                        state = 'MORPHING_TO_CIRCLE';
                    }
                }
            } else if (state === 'MORPHING_TO_CIRCLE') {
                progress += speed * delta * 2;
                if (progress >= 1) {
                    slices *= 2; // Chop!
                    statusText.innerText = `Slices: ${slices === maxSlices ? '∞ (Approaching infinity)' : slices}`;
                    progress = 0;
                    state = 'CIRCLE';
                }
            }
        }

        // --- Controls ---
        document.getElementById('playPauseBtn').addEventListener('click', (e) => {
            if (slices >= maxSlices && state === 'RECTANGLE') return; // Ended
            isPlaying = !isPlaying;
            e.target.innerText = isPlaying ? 'Pause' : 'Play';
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            isPlaying = false;
            document.getElementById('playPauseBtn').innerText = 'Play';
            // Instantly jump through states
            if (state === 'CIRCLE') {
                state = 'UNROLLING'; progress = 1; 
                setTimeout(() => { state = 'RECTANGLE'; progress = 1; }, 50);
            } else if (state === 'RECTANGLE') {
                if (slices < maxSlices) {
                    slices *= 2;
                    statusText.innerText = `Slices: ${slices === maxSlices ? '∞' : slices}`;
                    state = 'CIRCLE';
                    progress = 0;
                }
            } else {
                state = 'RECTANGLE';
                progress = 1;
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isPlaying = false;
            document.getElementById('playPauseBtn').innerText = 'Play';
            slices = 4;
            state = 'CIRCLE';
            progress = 0;
            statusText.innerText = `Slices: 4`;
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
