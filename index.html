<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a Circle: Infinity Proof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .canvas-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Formula card animation */
        .formula-card {
            opacity: 0;
            transform: translateY(20px) translateX(-50%);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .formula-card.visible {
            opacity: 1;
            transform: translateY(0) translateX(-50%);
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-6xl w-full">
        
        <!-- Header & Explanatory Text -->
        <header class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">The Infinity Proof: Area of a Circle</h1>
            
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 max-w-4xl mx-auto shadow-sm min-h-[100px] flex flex-col justify-center items-center transition-all duration-300">
                <div class="flex items-center gap-3 mb-2">
                    <span class="bg-blue-600 text-white text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wider">Status</span>
                    <span class="text-slate-500 font-semibold">Slices: <span id="sliceCountLabel" class="text-blue-700 text-xl font-bold ml-1">4</span></span>
                </div>
                <p id="explanationText" class="text-lg md:text-xl text-blue-900 font-medium text-center m-0 transition-opacity duration-300"></p>
            </div>
        </header>

        <!-- Controls -->
        <div class="flex justify-center gap-4 mb-6">
            <button id="btnTogglePlay" class="btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-indigo-200 flex items-center gap-2 text-lg w-48 justify-center">
                <svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>
                <svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"/></svg>
                <span id="playText">Play</span>
            </button>
            <button id="btnNext" class="btn bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-bold py-3 px-8 rounded-xl shadow-sm flex items-center gap-2 text-lg">
                Next Step <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </button>
            <button id="btnReset" class="btn bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold py-3 px-8 rounded-xl shadow-sm text-lg">
                Reset
            </button>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-container border border-slate-200">
            <canvas id="simCanvas" width="1200" height="500"></canvas>
            
            <!-- Floating Formula Conclusion -->
            <div id="conclusionOverlay" class="formula-card absolute bottom-10 left-[68%] bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-2xl border-2 border-indigo-500 z-10 w-80 text-center">
                <h3 class="text-2xl font-black text-indigo-900 mb-3 border-b border-indigo-100 pb-2">Final Formula</h3>
                <div class="space-y-3 text-lg font-medium text-slate-700 text-left">
                    <div class="flex justify-between">
                        <span>Height:</span> <span class="text-indigo-600 font-bold">r</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Width:</span> <span class="text-indigo-600 font-bold">π × r</span>
                    </div>
                    <div class="flex justify-between pt-3 text-2xl border-t border-indigo-100 mt-2">
                        <span>Area:</span> <span class="text-indigo-700 font-black">πr²</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const textEl = document.getElementById('explanationText');
        const sliceCountEl = document.getElementById('sliceCountLabel');
        const overlay = document.getElementById('conclusionOverlay');
        
        const btnTogglePlay = document.getElementById('btnTogglePlay');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const playText = document.getElementById('playText');

        // Sequence Settings
        const SLICE_COUNTS = [4, 8, 16, 32, 64, 128, 256, 512, 1024];
        
        // Geometry Constants
        const W = canvas.width;
        const H = canvas.height;
        const R = 150;
        const CX = 250; // Circle left side
        const CY = 250;
        const RX = 850; // Rect right side
        const RY = 250;

        // State Machine Variables
        let sliceIndex = 0;
        let phase = 'CIRCLE_WAIT'; // CIRCLE_WAIT, UNROLLING, RECT_WAIT, MORPHING, DONE
        let animProgress = 0; 
        let timer = 0;
        
        let isPlaying = false;
        let lastTime = 0;

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // Ensures slices take the shortest rotational path
        function closestAngle(current, target) {
            let diff = (target - current) % (Math.PI * 2);
            if (diff > Math.PI) diff -= Math.PI * 2;
            if (diff < -Math.PI) diff += Math.PI * 2;
            return current + diff;
        }

        function updateUI() {
            let text = "";
            let N = SLICE_COUNTS[sliceIndex];
            
            if (phase === 'CIRCLE_WAIT') text = `Step ${sliceIndex + 1}: The circle is divided into ${N} equal slices.`;
            else if (phase === 'UNROLLING') text = `Slowly unrolling and rearranging the ${N} slices...`;
            else if (phase === 'RECT_WAIT') text = `Arranged! The shape is starting to resemble a rectangle.`;
            else if (phase === 'MORPHING') text = `As we approach an INFINITE number of slices...`;
            else if (phase === 'DONE') text = `A perfect rectangle is formed! Area = πr × r = πr²`;
            
            textEl.innerText = text;
            sliceCountEl.innerText = (phase === 'MORPHING' || phase === 'DONE') ? '∞ (Infinity)' : N;

            overlay.classList.toggle('visible', phase === 'DONE');
            
            // Update Toggle Button
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                playText.innerText = 'Pause';
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                playText.innerText = 'Play';
            }
        }

        function drawBackgroundGuides() {
            // Ghost Circle
            ctx.beginPath();
            ctx.arc(CX, CY, R, 0, Math.PI * 2);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Center Dot
            ctx.beginPath();
            ctx.arc(CX, CY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#94a3b8';
            ctx.fill();

            // Ghost Radius Line
            ctx.beginPath();
            ctx.moveTo(CX, CY);
            ctx.lineTo(CX + R, CY);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = 'italic bold 18px Inter';
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'center';
            ctx.fillText('r', CX + R/2, CY - 10);
        }

        // Draws the mathematical labels surrounding the rectangle
        function drawRectAnnotations(opacity, isPerfect) {
            if (opacity <= 0) return;
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.strokeStyle = '#475569';
            ctx.fillStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.font = 'bold 18px Inter, sans-serif';

            const perfectW = Math.PI * R;
            const startX = RX - perfectW / 2;
            
            // Height Line (Right side)
            const hX = startX + perfectW + 40;
            ctx.beginPath();
            ctx.moveTo(hX, RY - R/2);
            ctx.lineTo(hX, RY + R/2);
            ctx.stroke();
            
            // End caps
            ctx.beginPath();
            ctx.moveTo(hX - 6, RY - R/2); ctx.lineTo(hX + 6, RY - R/2);
            ctx.moveTo(hX - 6, RY + R/2); ctx.lineTo(hX + 6, RY + R/2);
            ctx.stroke();
            
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('r', hX + 12, RY);

            // Width Line (Bottom side)
            const wY = RY + R/2 + 40;
            ctx.beginPath();
            ctx.moveTo(startX, wY);
            ctx.lineTo(startX + perfectW, wY);
            ctx.stroke();
            
            // End caps
            ctx.beginPath();
            ctx.moveTo(startX, wY - 6); ctx.lineTo(startX, wY + 6);
            ctx.moveTo(startX + perfectW, wY - 6); ctx.lineTo(startX + perfectW, wY + 6);
            ctx.stroke();
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(isPerfect ? 'π × r' : '≈ π × r (Approaching πr)', RX, wY + 12);

            ctx.restore();
        }

        function drawSlices(N, progress) {
            const theta = (Math.PI * 2) / N;
            const C = 2 * R * Math.sin(theta / 2);
            const H_tri = R * Math.cos(theta / 2);
            const RectW = (N / 2) * C;
            const startX = RX - RectW / 2;
            const ease = easeInOutCubic(progress);

            for (let i = 0; i < N; i++) {
                const isEven = i % 2 === 0;

                // Circle origin
                const cx = CX;
                const cy = CY;
                const crot = (i + 0.5) * theta;

                // Rectangle target
                let rx, ry, rrot;
                if (isEven) {
                    rx = startX + (i / 2) * C + C / 2;
                    ry = RY + H_tri / 2;
                    rrot = closestAngle(crot, -Math.PI / 2);
                } else {
                    rx = startX + Math.floor(i / 2) * C + C;
                    ry = RY - H_tri / 2;
                    rrot = closestAngle(crot, Math.PI / 2);
                }

                // Interpolate
                const x = cx + (rx - cx) * ease;
                const y = cy + (ry - cy) * ease;
                const rot = crot + (rrot - crot) * ease;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rot);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, R, -theta / 2, theta / 2);
                ctx.closePath();

                ctx.fillStyle = isEven ? '#3b82f6' : '#60a5fa'; 
                ctx.fill();
                
                // Add visible chop lines for lower N values
                if (N <= 128) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = N <= 32 ? 1.5 : 0.5;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function drawInfinityMorph() {
            const perfectW = Math.PI * R;
            const startX = RX - perfectW / 2;
            const startY = RY - R / 2;

            ctx.save();
            ctx.globalAlpha = animProgress; // Crossfade to solid rectangle
            
            // Solid Rectangle overlay
            ctx.fillStyle = '#4f46e5'; 
            ctx.shadowColor = 'rgba(79, 70, 229, 0.5)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 10;
            
            ctx.fillRect(startX, startY, perfectW, R);
            
            ctx.strokeStyle = '#312e81';
            ctx.lineWidth = 3;
            ctx.strokeRect(startX, startY, perfectW, R);
            
            // Equation drawn right in the middle of the block
            if (animProgress > 0.5) {
                ctx.globalAlpha = (animProgress - 0.5) * 2;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 0; // Turn off shadow for text crispness
                ctx.fillText('Area = πr²', RX, RY);
            }

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            drawBackgroundGuides();

            let N = SLICE_COUNTS[sliceIndex];

            if (phase === 'CIRCLE_WAIT') {
                drawSlices(N, 0);
            } 
            else if (phase === 'UNROLLING') {
                drawSlices(N, animProgress);
            } 
            else if (phase === 'RECT_WAIT') {
                drawSlices(N, 1);
                drawRectAnnotations(1, false);
            } 
            else if (phase === 'MORPHING' || phase === 'DONE') {
                // Keep the last N slices as the background base, morph the perfect rect on top
                drawSlices(SLICE_COUNTS[SLICE_COUNTS.length - 1], 1); 
                drawInfinityMorph();
                drawRectAnnotations(1, true);
            }
        }

        function updateLogic(dt) {
            switch (phase) {
                case 'CIRCLE_WAIT':
                    timer += dt;
                    if (timer > 1500) { // Wait 1.5 seconds to observe chopped circle
                        phase = 'UNROLLING';
                        animProgress = 0;
                        updateUI();
                    }
                    break;
                case 'UNROLLING':
                    animProgress += dt / 3000; // 3 seconds to unroll
                    if (animProgress >= 1) {
                        animProgress = 1;
                        phase = 'RECT_WAIT';
                        timer = 0;
                        updateUI();
                    }
                    break;
                case 'RECT_WAIT':
                    timer += dt;
                    if (timer > 2000) { // Wait 2 seconds to observe rectangle
                        if (sliceIndex === SLICE_COUNTS.length - 1) {
                            phase = 'MORPHING';
                            animProgress = 0;
                        } else {
                            sliceIndex++;
                            phase = 'CIRCLE_WAIT'; // Return to chopped circle for new N
                            timer = 0;
                        }
                        updateUI();
                    }
                    break;
                case 'MORPHING':
                    animProgress += dt / 2000; // 2 seconds to morph
                    if (animProgress >= 1) {
                        animProgress = 1;
                        phase = 'DONE';
                        isPlaying = false;
                        updateUI();
                    }
                    break;
                case 'DONE':
                    break; // Wait for user interaction
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                updateLogic(dt);
            }

            render();
            requestAnimationFrame(loop);
        }

        // --- Event Listeners ---
        
        btnTogglePlay.addEventListener('click', () => {
            if (phase === 'DONE') {
                // Auto-reset if they click play at the end
                document.getElementById('btnReset').click();
                isPlaying = true;
                updateUI();
                return;
            }
            isPlaying = !isPlaying;
            updateUI();
        });

        document.getElementById('btnNext').addEventListener('click', () => {
            isPlaying = false; // Pause auto-play to allow manual stepping
            
            if (phase === 'CIRCLE_WAIT') {
                phase = 'UNROLLING';
                animProgress = 0;
            } 
            else if (phase === 'UNROLLING') {
                phase = 'RECT_WAIT';
                animProgress = 1;
                timer = 0;
            } 
            else if (phase === 'RECT_WAIT') {
                if (sliceIndex === SLICE_COUNTS.length - 1) {
                    phase = 'MORPHING';
                    animProgress = 0;
                } else {
                    sliceIndex++;
                    phase = 'CIRCLE_WAIT';
                    timer = 0;
                }
            } 
            else if (phase === 'MORPHING') {
                phase = 'DONE';
                animProgress = 1;
            }
            
            updateUI();
            render();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            isPlaying = false;
            sliceIndex = 0;
            phase = 'CIRCLE_WAIT';
            animProgress = 0;
            timer = 0;
            updateUI();
            render();
        });

        // Initialize
        updateUI();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
