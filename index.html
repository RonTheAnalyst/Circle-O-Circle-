<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a Circle Simulation</title>
    <style>
        body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        .container {
            max-width: 56rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.875rem;
            font-weight: 800;
            color: #1f2937;
            margin: 0 0 0.5rem 0;
            text-align: center;
        }
        .description {
            color: #4b5563;
            margin: 0 0 1.5rem 0;
            text-align: center;
            line-height: 1.5;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        button {
            padding: 0.5rem 1.5rem;
            color: #ffffff;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #playPauseBtn { background-color: #2563eb; }
        #playPauseBtn:hover { background-color: #1d4ed8; }
        #nextBtn { background-color: #16a34a; }
        #nextBtn:hover { background-color: #15803d; }
        #resetBtn { background-color: #6b7280; }
        #resetBtn:hover { background-color: #4b5563; }
        
        #statusText {
            font-size: 1.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin-bottom: 1rem;
            color: #374151;
            font-weight: 700;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1>Area of a Circle: Unrolling into a Rectangle</h1>
        <p class="description">Watch how dividing a circle into smaller slices approaches a perfect rectangle with width = πr and height = r, proving Area = πr².</p>
        
        <div class="button-group">
            <button id="playPauseBtn">Play</button>
            <button id="nextBtn">Next Step</button>
            <button id="resetBtn">Reset</button>
        </div>
        
        <div id="statusText">Slices: 4</div>
        
        <canvas id="simCanvas" width="900" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        
        let isPlaying = false;
        let slices = 4;
        const maxSlices = 2048; 
        let progress = 0; 
        
        // Animation States: 'CIRCLE' -> 'UNROLLING' -> 'RECTANGLE' -> 'MORPHING_TO_CIRCLE'
        let state = 'CIRCLE'; 
        
        const R = 120; 
        const circleCenter = { x: 450, y: 150 };
        const rectCenter = { x: 450, y: 400 };

        function drawWedge(cx, cy, radius, startAngle, endAngle, color) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const sliceAngle = (2 * Math.PI) / slices;
            const rectWidth = Math.PI * R;
            const wedgeBaseWidth = rectWidth / (slices / 2);
            const startX = rectCenter.x - rectWidth / 2;

            for (let i = 0; i < slices; i++) {
                const color = i % 2 === 0 ? '#3b82f6' : '#60a5fa';
                
                const currentAngle = i * sliceAngle;
                const isBottom = i % 2 === 0;
                let targetX, targetY, targetStartAngle;
                
                if (isBottom) {
                    targetX = startX + (i / 2) * wedgeBaseWidth + wedgeBaseWidth / 2;
                    targetY = rectCenter.y + R / 2; 
                    targetStartAngle = -Math.PI / 2 - sliceAngle / 2;
                } else {
                    targetX = startX + Math.floor(i / 2) * wedgeBaseWidth + wedgeBaseWidth;
                    targetY = rectCenter.y - R / 2; 
                    targetStartAngle = Math.PI / 2 - sliceAngle / 2;
                }

                let x = circleCenter.x;
                let y = circleCenter.y;
                let t = 0;
                
                if (state === 'UNROLLING' || state === 'MORPHING_TO_CIRCLE') {
                    const delay = i * (0.5 / slices);
                    let rawT = (progress - delay) * 2; 
                    t = Math.max(0, Math.min(1, rawT));
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 
                    if (state === 'MORPHING_TO_CIRCLE') t = 1 - t;
                } else if (state === 'RECTANGLE') {
                    t = 1;
                }

                x = circleCenter.x + (targetX - circleCenter.x) * t;
                y = circleCenter.y + (targetY - circleCenter.y) * t;
                let currentRot = currentAngle + (targetStartAngle - currentAngle) * t;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(currentRot + sliceAngle / 2);
                drawWedge(0, 0, R, -sliceAngle / 2, sliceAngle / 2, color);
                ctx.restore();
            }

            if (state === 'RECTANGLE' && progress > 0.8) {
                ctx.fillStyle = '#374151';
                ctx.font = '16px monospace';
                ctx.fillText('Height = r', startX - 100, rectCenter.y + 5);
                ctx.fillText('Width = πr', rectCenter.x - 40, rectCenter.y + R / 2 + 30);
                
                if (slices >= 256) {
                    ctx.font = 'bold 24px sans-serif';
                    ctx.fillStyle = '#111827';
                    ctx.fillText('Area = (πr) × r = πr²', rectCenter.x - 110, rectCenter.y - R - 30);
                }
            }
        }

        let animationId;
        let lastTime = 0;
        
        function animate(time) {
            if (!lastTime) lastTime = time;
            const delta = time - lastTime;
            lastTime = time;

            if (isPlaying) {
                stepAnimation(delta);
            }
            
            render();
            animationId = requestAnimationFrame(animate);
        }

        function stepAnimation(delta) {
            const speed = 0.0008; 
            
            if (state === 'CIRCLE') {
                progress += speed * delta;
                if (progress > 0.5) {
                    progress = 0;
                    state = 'UNROLLING';
                }
            } else if (state === 'UNROLLING') {
                progress += speed * delta * 1.5;
                if (progress >= 1) {
                    progress = 1;
                    state = 'RECTANGLE';
                }
            } else if (state === 'RECTANGLE') {
                progress += speed * delta * 0.5;
                if (progress > 1.5) {
                    progress = 0;
                    if (slices >= maxSlices) {
                        isPlaying = false;
                        document.getElementById('playPauseBtn').innerText = 'Done';
                    } else {
                        state = 'MORPHING_TO_CIRCLE';
                    }
                }
            } else if (state === 'MORPHING_TO_CIRCLE') {
                progress += speed * delta * 2;
                if (progress >= 1) {
                    slices *= 2;
                    statusText.innerText = `Slices: ${slices === maxSlices ? '∞ (Approaching infinity)' : slices}`;
                    progress = 0;
                    state = 'CIRCLE';
                }
            }
        }

        document.getElementById('playPauseBtn').addEventListener('click', (e) => {
            if (slices >= maxSlices && state === 'RECTANGLE') return;
            isPlaying = !isPlaying;
            e.target.innerText = isPlaying ? 'Pause' : 'Play';
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            isPlaying = false;
            document.getElementById('playPauseBtn').innerText = 'Play';
            if (state === 'CIRCLE') {
                state = 'UNROLLING'; progress = 1; 
                setTimeout(() => { state = 'RECTANGLE'; progress = 1; }, 50);
            } else if (state === 'RECTANGLE') {
                if (slices < maxSlices) {
                    slices *= 2;
                    statusText.innerText = `Slices: ${slices === maxSlices ? '∞' : slices}`;
                    state = 'CIRCLE';
                    progress = 0;
                }
            } else {
                state = 'RECTANGLE';
                progress = 1;
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isPlaying = false;
            document.getElementById('playPauseBtn').innerText = 'Play';
            slices = 4;
            state = 'CIRCLE';
            progress = 0;
            statusText.innerText = `Slices: 4`;
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
